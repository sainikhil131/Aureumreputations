<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Business - Aureum Reputations</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='LOGOS.png') }}?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #0a0a0a;
            --primary-text: #ffffff;
            --accent-gold: #D4AF37;
            --text-muted: #999;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--primary-text);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: 
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: backgroundPulse 8s ease-in-out infinite;
        }

        @keyframes backgroundPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            border-radius: 2px;
        }

        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 3.2em;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 50%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            letter-spacing: -1px;
        }

        .header .icon {
            display: inline-block;
            font-size: 0.8em;
            color: var(--accent-gold);
            margin-right: 15px;
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.2em;
            font-weight: 500;
            margin-top: 10px;
        }

        /* Alerts */
        .alert {
            padding: 20px 25px;
            border-radius: 15px;
            margin-bottom: 40px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(20px);
            border: 1px solid;
            position: relative;
            overflow: hidden;
        }

        .alert::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.8s;
        }

        .alert:hover::before {
            left: 100%;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.4);
            color: #4ade80;
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.2);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.4);
            color: #f87171;
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.2);
        }

        /* Main Card */
        .main-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 24px;
            padding: 0;
            margin-bottom: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(212, 175, 55, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.05), transparent);
            transition: left 1s;
        }

        .main-card:hover::before {
            left: 100%;
        }

        /* Form Section */
        .form-section {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 30px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            color: var(--accent-gold);
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 13px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 18px 22px;
            color: var(--primary-text);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent-gold);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 
                0 0 0 4px rgba(212, 175, 55, 0.1),
                0 8px 32px rgba(212, 175, 55, 0.2);
            transform: translateY(-2px);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }

        .form-help {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-style: italic;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #FFD700 100%);
            color: #000;
            border: none;
            border-radius: 15px;
            padding: 20px 30px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 20px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.6);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Back Link */
        .back-section {
            text-align: center;
            margin-top: 30px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
        }

        .back-link:hover {
            color: var(--accent-gold);
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateX(-5px);
            background: rgba(212, 175, 55, 0.05);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 2.5em;
            }

            .main-card {
                border-radius: 20px;
            }

            .form-section {
                padding: 25px 20px;
            }

            .form-group input,
            .form-group textarea {
                padding: 16px 18px;
                font-size: 15px;
            }

            .submit-btn {
                padding: 18px 25px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 2em;
            }

            .form-section {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-edit icon"></i>
                Edit Business
            </h1>
            <p>Update your business information and Google Maps link</p>
        </div>

        <!-- Alerts -->
        {% if success %}
        <div class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            {{ success }}
        </div>
        {% endif %}

        {% if error %}
        <div class="alert alert-error">
            <i class="fas fa-exclamation-triangle"></i>
            {{ error }}
        </div>
        {% endif %}

        <!-- Main Card -->
        <div class="main-card">
            <!-- Form Section -->
            <div class="form-section">
                <form method="POST">
                    <div class="form-group">
                        <label for="business_name">
                            <i class="fas fa-building"></i>
                            Business Name
                        </label>
                        <input type="text" 
                               id="business_name" 
                               name="business_name" 
                               placeholder="Enter your business name"
                               value="{{ business.name if business else '' }}"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="google_review_link">
                            <i class="fas fa-link"></i>
                            Google Maps URL
                        </label>
                        <textarea id="google_review_link" 
                                  name="google_review_link" 
                                  placeholder="Paste your Google Maps URL or direct review link (g.page/r/CODE/review) here..."
                                  required>{{ business.google_review_link if business else '' }}</textarea>
                        <div class="form-help">
                            <i class="fas fa-magic"></i>
                            Accepts Google Maps URLs or direct review links (g.page/r/CODE/review). We'll automatically optimize for faster customer reviews.
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">
                        Update Business
                    </button>
                </form>
            </div>
        </div>

        <!-- Back Link -->
        <div class="back-section">
            <a href="/admin" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Dashboard
            </a>
        </div>
    </div>

    <script>
        // Form validation and loading state
        document.querySelector('form').addEventListener('submit', function(e) {
            const businessName = document.getElementById('business_name').value.trim();
            const reviewLink = document.getElementById('google_review_link').value.trim();

            if (!businessName || !reviewLink) {
                e.preventDefault();
                alert('Please fill in all fields');
                return;
            }

            if (!reviewLink.includes('google.com/maps') && 
                !reviewLink.includes('maps.google.com') && 
                !reviewLink.includes('goo.gl') &&
                !reviewLink.includes('g.page/r/')) {
                e.preventDefault();
                alert('Please enter a valid Google Maps URL or direct review link (g.page/r/)');
                return;
            }

            // Show loading state
            const btn = document.querySelector('.submit-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating Business...';
            btn.disabled = true;
        });
    </script>
</body>
</html>
