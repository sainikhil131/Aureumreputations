<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aureum Reputations</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='LOGOS.png') }}?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-bg: #0a0a0a;
            --secondary-bg: #121212;
            --primary-text: #ffffff;
            --accent-gold: #D4AF37;
            --card-border: #D4AF37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: var(--primary-bg);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--primary-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            background: linear-gradient(135deg, rgba(18, 18, 18, 0.9) 0%, rgba(18, 18, 18, 0.7) 100%);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            transition: left 0.8s;
        }

        .login-container:hover::before {
            left: 100%;
        }

        .login-header {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.05) 100%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            color: var(--primary-text);
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .login-header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .login-header h1 i {
            color: var(--accent-gold);
            font-size: 28px;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            line-height: 1.6;
        }

        .login-form {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--accent-gold);
            font-size: 14px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 16px 18px;
            color: var(--primary-text);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            backdrop-filter: blur(10px);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-group input:hover {
            border-color: rgba(212, 175, 55, 0.4);
        }

        .form-group input:focus {
            border-color: var(--accent-gold);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1), 0 4px 20px rgba(212, 175, 55, 0.15);
            transform: translateY(-1px);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #FFD700 100%);
            color: #000000;
            border: none;
            border-radius: 14px;
            padding: 18px 40px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 14px;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.6);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 18px 24px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: 500;
            text-align: center;
            font-size: 15px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid rgba(239, 68, 68, 0.6);
            color: #ef4444;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.2);
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 2px solid rgba(34, 197, 94, 0.6);
            color: #22c55e;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.2);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
            position: relative;
        }

        .back-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--accent-gold);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
        }

        .back-link:hover {
            color: #FFD700;
            transform: translateY(-2px);
        }

        .back-link:hover::after {
            width: 100%;
        }

        @media (max-width: 768px) {
            .login-container {
                margin: 10px;
                border-radius: 16px;
                max-width: 380px;
            }
            
            .login-header {
                padding: 30px 25px;
            }
            
            .login-header h1 {
                font-size: 28px;
            }
            
            .login-form {
                padding: 30px 25px;
            }

            .form-group input {
                padding: 14px 16px;
                font-size: 14px;
            }

            .login-btn {
                padding: 16px 32px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .login-header {
                padding: 25px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-form {
                padding: 25px 20px;
            }

            .login-btn {
                padding: 14px 28px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-sign-in-alt"></i> Login</h1>
            <p>Access your dashboard </p>
        </div>

        <div class="login-form">
            {% if request.args.get('success') %}
                <div class="alert alert-success">
                    <i class="fas fa-check-circle"></i> {{ request.args.get('success') }}
                </div>
            {% endif %}

            {% if error %}
                <div class="alert alert-error">
                    <i class="fas fa-exclamation-triangle"></i> {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Username / Email</label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           placeholder="Enter  email address" 
                           required>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           placeholder="Enter your password" 
                           required>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script>
        // Form validation
        document.querySelector('form').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                e.preventDefault();
                alert('Please fill in all fields');
                return;
            }

            // Show loading state
            const btn = document.querySelector('.login-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            btn.disabled = true;
        });
    </script>
</body>
</html>
